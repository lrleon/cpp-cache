name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ALEPH_DIR: ${{ github.workspace }}/../Aleph-w
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgsl-dev libx11-dev libmpfr-dev

      - name: Fetch Aleph-w dependency
        run: git clone --depth=1 https://github.com/lrleon/Aleph-w.git "$ALEPH_DIR"

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DALEPH_DIR="$ALEPH_DIR" -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF

      - name: Build unit and concurrency tests
        run: cmake --build build --target cache_unit_test cache_concurrency_test cache_hardened_test cache_concurrency_hardened_test

      - name: Run test suite
        run: scripts/run_tests.sh

  # ----------------------------------------------------------------
  # Sanitizer jobs — run in parallel with build-and-test
  # ----------------------------------------------------------------

  sanitize-asan-ubsan:
    name: "ASan + UBSan"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ALEPH_DIR: ${{ github.workspace }}/../Aleph-w
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgsl-dev libx11-dev libmpfr-dev

      - name: Fetch Aleph-w dependency
        run: git clone --depth=1 https://github.com/lrleon/Aleph-w.git "$ALEPH_DIR"

      - name: Configure with ASan + UBSan
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DALEPH_DIR="$ALEPH_DIR"
          -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          -DSANITIZE=address,undefined

      - name: Build
        run: cmake --build build-asan

      - name: Run tests under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure -L cpp_cache

  sanitize-tsan:
    name: "TSan (Clang)"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ALEPH_DIR: ${{ github.workspace }}/../Aleph-w
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgtest-dev libgsl-dev libx11-dev libmpfr-dev

      - name: Fetch Aleph-w dependency
        run: git clone --depth=1 https://github.com/lrleon/Aleph-w.git "$ALEPH_DIR"

      - name: Configure with TSan (Clang)
        run: >
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang
          -DALEPH_DIR="$ALEPH_DIR"
          -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          -DSANITIZE=thread

      - name: Build
        run: cmake --build build-tsan

      - name: Run tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure -L cpp_cache
